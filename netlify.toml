# Three Wishes Bakery — Netlify config
#
# There is no build step. The site is plain HTML/CSS/JS served straight from
# the repo root, so `command` is intentionally empty and `publish` is ".".
# This is what lets the site be deployed by linking the Git repo instead of
# drag-and-dropping a folder.

# No `command` key on purpose. This site is already HTML — there is nothing to
# compile. Declaring even an empty build command gives Netlify a script that can
# exit non-zero and fail the deploy; omitting it means no build stage runs at all.
# Works identically for a drag-and-drop deploy and a Git-linked one.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Long-cache the photos (they're content-addressed by name and rarely change);
# keep HTML uncached so a deploy is visible immediately.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
