<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wish granted ✦ Three Wishes Bakery</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="magic.css">
</head>
<body>
<section class="section container" style="text-align:center;padding-top:90px">
  <div style="font-size:4rem">🍪✦</div>
  <h1 style="font-family:var(--font-display);font-size:clamp(2rem,5vw,3rem);margin:14px 0">Wish granted.</h1>
  <p style="max-width:46ch;margin:0 auto 12px">Your order is in and your receipt is on its way to your inbox. We bake to order and ship Mondays &amp; Wednesdays — warm wishes are coming.</p>
  <p style="margin-bottom:28px;color:#7a6467;font-size:.9rem">Questions? <a href="mailto:hello@3wishesbakery.com">hello@3wishesbakery.com</a></p>
  <a class="btn btn-primary" href="index.html">Back to the bakery →</a>
</section>
<script>try{localStorage.removeItem("tw_cart")}catch(e){}</script>
<script src="magic.js"></script>
<script>
/* the order landed — celebrate with a full genie burst */
window.addEventListener("load", () => {
  if (!window.TWMagic) return;
  const x = innerWidth / 2, y = innerHeight * 0.34;
  window.TWMagic.poof(x, y, { count: 22, rise: 280, spread: 220, sparks: 20 });
  setTimeout(() => window.TWMagic.poof(x - 120, y + 40, { count: 12, rise: 200 }), 260);
  setTimeout(() => window.TWMagic.poof(x + 120, y + 40, { count: 12, rise: 200 }), 420);
});
</script>
</body>
</html>
